<div class="category-grid mb-5">
  <div
    class="card"
    *ngFor="let card of category"
    [routerLink]="'/category/' + card.title"
    style="cursor: pointer;"
  >
    <div class="icon">
      <i class="{{card.i}}"></i>
    </div>
    <h5 class="text-center">{{card.title}}</h5>
  </div>
</div>
<hr class="mt-5 mb-5">
