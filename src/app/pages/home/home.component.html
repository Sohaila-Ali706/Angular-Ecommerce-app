<div class="container">
  <div
    class="sidebar"
    [class.is-open]="isSidebarOpen"
  >
    <button
      class="sidebar-toggle"
      type="button"
      (click)="isSidebarOpen = !isSidebarOpen"
      [attr.aria-expanded]="isSidebarOpen"
      aria-controls="home-categories"
      [attr.aria-label]="isSidebarOpen ? 'Close categories' : 'Open categories'"
    >
      <i class="fa-solid" [class.fa-bars]="!isSidebarOpen" [class.fa-xmark]="isSidebarOpen"></i>
      <span *ngIf="isSidebarOpen">Categories</span>
    </button>
    <ul id="home-categories">
      <li *ngFor="let category of categories" (click)="navigateToFilteredProducts(category)">
        {{ category }}
      </li>
    </ul>
  </div>

  <div class="slider">
    <div class="slide">
      <div class="slide-text">
        <h3>
          {{ slides[currentSlideIndex].title }}
        </h3>
        <h2>{{ slides[currentSlideIndex].description }}</h2>
        <a [href]="slides[currentSlideIndex].link" class="shop-now" routerLink="/all-products">Shop Now →</a>
      </div>
      <div class="slide-image">
        <img [src]="slides[currentSlideIndex].image" alt="Product Image">
      </div>
    </div>
    <div class="slider-dots">
      <span
        *ngFor="let slide of slides; let i = index"
        class="dot"
        [class.active]="i === currentSlideIndex"
        (click)="goToSlide(i)">
      </span>
    </div>
  </div>
</div>
